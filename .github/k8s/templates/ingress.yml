{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.deployment.name }}
  labels:
    {{- include "deployment.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.deployment.name }}{{- if ne .Values.deployment.environment "PRODUCTION" }}.dev{{- end }}.{{ .Values.deployment.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.deployment.name }}
                port:
                  name: http
  tls:
    - hosts:
        - {{ .Values.deployment.name }}{{- if ne .Values.deployment.environment "PRODUCTION" }}.dev{{- end }}.{{ .Values.deployment.domain }}
      secretName: app-{{ .Values.deployment.name }}-tls-secret
