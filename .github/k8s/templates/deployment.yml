{{- include "deployment.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  labels:
    {{- include "deployment.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: # deployment manage pods with label key=value
    matchLabels:
      {{- include "deployment.selector" . | nindent 6 }}
  template:
    metadata:
      labels: # deployment will label pods with key=value
        {{- include "deployment.labels" . | nindent 8 }}
      annotations:
        checksum/environment: {{ include (print $.Template.BasePath "/environments.yml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.deployment.account }}
      serviceAccountName: {{ . | quote }}
      {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: # credentials to use when pulling container images
        {{- toYaml . | nindent 8 }}
      {{- end }}

      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        -

        {{- $defaultImage := .Values.defaults.image }}
        {{- range $name, $service := .Values.services }}
        {{- $image := default dict $service.image }}
        {{- $native := default dict $service.native }}
        {{- $maps := include "deployment.environmentMaps" (dict "defaults" $.Values.defaults "service" $service) | fromYaml }}
        - name: {{ $name }}
          image: {{ printf "%s:%s" (required (printf "set services.%s.image.name or defaults.image.name" $name) (default $defaultImage.name $image.name)) (required (printf "set services.%s.image.tag or defaults.image.tag" $name) (default $defaultImage.tag $image.tag) | toString) | quote }}
          imagePullPolicy: {{ default $defaultImage.pullPolicy $image.pullPolicy }}

          {{- if or $maps.environments $maps.secrets }}
          envFrom:
            {{- if $maps.environments }}
            - configMapRef:
                name: {{ $.Values.deployment.name }}-{{ $name }}-env
            {{- end }}
            {{- if $maps.secrets }}
            - secretRef:
                name: {{ $.Values.deployment.name }}-{{ $name }}-secrets
            {{- end }}
          {{- end }}

          securityContext:
            {{- mergeOverwrite (dict "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL"))) (default dict $native.securityContext) | toYaml | nindent 12 }}

          {{- range $field := list "env" "command" "args" "ports" "resources" "volumeMounts" "startupProbe" "readinessProbe" "livenessProbe" }}
          {{- with index $native $field }}
          {{ $field }}:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- end }}
        {{- end }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" .Values.deployment.name) .Values.persistence.existingClaim | quote }}
